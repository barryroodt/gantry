name: Bench Docker Smoke

# Builds the bench Docker image and runs the keyless smoke inside it.
# Proves: the image builds, both competitor-CLI pins still install, and the
# bench pipeline runs end-to-end on Linux — no API key.
#
# Kept OFF the per-PR/per-push critical path (it is the CI long pole and ships
# no artifact — the Release workflow has its own glibc smoke). It runs only
# when the bench image inputs change, or on demand. NOTE: a source-only change
# that breaks the bench build is therefore caught the next time a bench-path or
# toolchain file changes, or via a manual `workflow_dispatch` run — not on the
# triggering PR.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - bench/**
      - mise.toml
      - .github/workflows/bench-smoke.yml
  push:
    branches: [main]
    paths:
      - bench/**
      - mise.toml
      - .github/workflows/bench-smoke.yml

permissions:
  contents: read

concurrency:
  group: bench-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bench-docker-smoke:
    name: bench docker smoke
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to commit SHAs (not mutable tags) so a moved/compromised
      # tag cannot inject code into CI. The trailing comment tracks the version for
      # Dependabot, which bumps the SHA + comment together.
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Build bench image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: bench/docker/Dockerfile
          tags: gantry-bench:ci
          load: true
          build-args: |
            GANTRY_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run keyless smoke
        run: |
          mkdir -p bench-results
          docker run --rm -v "$PWD/bench-results:/results" gantry-bench:ci smoke

      - name: Assert artifacts
        run: |
          out=$(find bench-results -mindepth 1 -maxdepth 1 -type d | head -1)
          test -n "$out"
          test -f "$out/results.json"
          test -f "$out/report.md"
          ls "$out"/raw/*.json

      - name: Upload smoke results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bench-docker-smoke-results
          path: bench-results/
