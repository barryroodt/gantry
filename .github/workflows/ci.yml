name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: gate
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to commit SHAs (not mutable tags) so a moved/compromised
      # tag cannot inject code into CI. The trailing comment tracks the version for
      # Dependabot, which bumps the SHA + comment together.
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      # Supply-chain gate: fail on RUSTSEC advisories, yanked crates, and any crate
      # source other than crates.io + our allow-listed git dep (policy in deny.toml).
      # Runs first so a bad dependency short-circuits before the expensive build.
      - name: Supply-chain audit (cargo-deny)
        uses: EmbarkStudios/cargo-deny-action@bb137d7af7e4fb67e5f82a49c4fce4fad40782fe # v2.0.20
        with:
          command: check
          command-arguments: advisories bans sources

      # Single source of truth: read the Rust version + components from mise.toml
      # so CI and local dev can never drift (previously 1.96.0 was duplicated here).
      - name: Read toolchain from mise.toml
        id: rust
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import tomllib
          t = tomllib.load(open("mise.toml", "rb"))["tools"]["rust"]
          print(f"version={t['version']}")
          print(f"components={t['components']}")
          PY

      # dtolnay reliably installs the components, which mise-action did not.
      - name: Install Rust + components
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master, pinned by SHA
        with:
          toolchain: ${{ steps.rust.outputs.version }}
          components: ${{ steps.rust.outputs.components }}

      - name: Cargo cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1

      - name: Format
        run: cargo fmt --check

      # --locked: build the committed Cargo.lock exactly and fail if it would need
      # changes. Catches manifest/lock drift and the inconsistent lock-only
      # dependency PRs that would otherwise silently re-resolve.
      - name: Build
        run: cargo build --workspace --all-targets --locked

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

  # Builds the bench Docker image and runs the keyless smoke inside it.
  # Continuously proves: the image builds, both competitor-CLI pins still
  # install, and the bench pipeline runs end-to-end on Linux — no API key.
  bench-docker-smoke:
    name: bench docker smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Build bench image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: bench/docker/Dockerfile
          tags: gantry-bench:ci
          load: true
          build-args: |
            GANTRY_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run keyless smoke
        run: |
          mkdir -p bench-results
          docker run --rm -v "$PWD/bench-results:/results" gantry-bench:ci smoke

      - name: Assert artifacts
        run: |
          out=$(find bench-results -mindepth 1 -maxdepth 1 -type d | head -1)
          test -n "$out"
          test -f "$out/results.json"
          test -f "$out/report.md"
          ls "$out"/raw/*.json

      - name: Upload smoke results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bench-docker-smoke-results
          path: bench-results/
