# cargo-deny supply-chain policy. Run locally: `cargo deny check`.
#
# A green build proves the lockfile parses, not that a dependency change is safe.
# CI gates on `cargo deny check advisories bans sources` (see ci.yml) — those three
# read the lock graph and are platform-independent. The license check is kept tuned
# and passing locally, but is NOT yet gated in CI: the allow-list is verified on
# macOS and may drift on the Linux runner, so enabling it needs a Linux check first
# (tracked in tech-debt.md).

[advisories]
version = 2
# Yanked versions often signal a pulled/compromised release — treat as an error.
yanked = "deny"
# Consciously-accepted RUSTSEC IDs go here, each with a justification comment.
ignore = []

[bans]
# We intentionally carry a few duplicate major versions (e.g. thiserror 1 + 2,
# toml 0.8 + 1.x) pulled in transitively. Surface them, do not fail on them.
multiple-versions = "warn"
wildcards = "allow"

[sources]
# Deny code from anywhere except crates.io and our known git source. A new,
# unexpected git/registry source in a dependency update is a hard failure —
# this is the primary supply-chain control.
unknown-registry = "deny"
unknown-git = "deny"
allow-git = ["https://github.com/can1357/oh-my-pi"]

[licenses]
version = 2
confidence-threshold = 0.8
# Permissive licenses only. WTFPL is public-domain-equivalent (one transitive dep).
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Zlib",
  "MPL-2.0",
  "BSL-1.0",
  "0BSD",
  "CDLA-Permissive-2.0",
  "WTFPL",
]
# Allow-list is generous for cross-platform robustness; don't warn on entries that
# no crate in the current graph happens to use.
unused-allowed-license = "allow"
