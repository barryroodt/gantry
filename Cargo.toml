[workspace]
members = [".", "evals"]
resolver = "2"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[package]
name = "gantry"
version = "0.1.0"
edition = "2021"

[lib]
name = "gantry"
path = "src/lib.rs"

[[bin]]
name = "gantry"
path = "src/main.rs"

[dependencies]
async-trait = "0.1"
rig-core = "0.37.0"
tokio = { version = "1", features = ["full"] }
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
clap = { version = "4", features = ["derive"] }
anyhow.workspace = true
thiserror = "2"
globwalk = "0.9"
regex = "1"
tokio-util = { version = "0.7", features = ["rt"] }
futures-util = "0.3"
toml = "0.8"
pi-ast = { git = "https://github.com/can1357/oh-my-pi", rev = "8b619a2" }
pi-shell = { git = "https://github.com/can1357/oh-my-pi", rev = "8b619a2" }
pi-iso = { git = "https://github.com/can1357/oh-my-pi", rev = "8b619a2" }

[dev-dependencies]
gantry-evals = { path = "evals" }
rig-core = "0.37.0"
tempfile = "3"
wiremock = "0.6"

# pi-shell pulls the vendored brush engine; oh-my-pi redirects brush-core/builtins
# to vendored crates via [patch.crates-io], which does NOT transit a git-dep — so
# we replicate the patch here (points at the same crates in the pinned repo).
[patch.crates-io]
brush-core = { git = "https://github.com/can1357/oh-my-pi", rev = "8b619a2" }
brush-builtins = { git = "https://github.com/can1357/oh-my-pi", rev = "8b619a2" }
